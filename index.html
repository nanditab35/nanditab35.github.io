<html>

<!--<meta name="viewport" content="width=device-width, initial-scale=1">-->
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

<head>
  <title>Nandita Bhattacharya's Homepage</title>
  <meta charset="UTF-8">
  <style>
    ul#menu li {
      display: inline;
    }
    div#frame {
      width: 80%;
      font-size: 15
    }
    a:link {
      text-decoration: none;
      color: blue;
    }
    a:visited {
      text-decoration: none;
      color: blue;
    }
  </style>
</head>

<body>
  <div id="frame0" style="margin-left: 3%; margin-right: 2%">
    <div id="frame" style="margin-left: 2cm">
      <div class="w3-container w3-teal" align="right" style="position: fixed; right:0px; left:0;">
      <!--background-color:#A41034!important;">-->
        <div id="name" style="float: left;margin-left: 10%; color:lightgreen">
          <h2>Nandita Bhattacharya</h2>
        </div>
        <div id="buttons" style="float: right; top: 50%; margin-top:1%; margin-right: 15%; margin-left: 7%">
          <!--<button class="w3-bar-item w3-button" onclick="location.href='#my_work'">My Work</button>
          <button class="w3-bar-item w3-button" onclick="location.href='#my_tech_blogs'">My Tech Blog</button>
          <button class="w3-bar-item w3-button" onclick="location.href='#my_art'">My Art</button>
          <button class="w3-bar-item w3-button" onclick="location.href='#my_blog'">My Blog</button>-->
          
          <button class="tab-button active" onclick="openTab('work.html', this)">About Me</button>
          <button class="tab-button" onclick="openTab('tech_blog.html', this)">Tech Blog</button>
          <button class="tab-button" onclick="openTab('art.html', this)">My Art</button>
          <button class="tab-button" onclick="openTab('blog.html', this)">My Blog</button>
        </div>
      </div>
      <!-- Content Frame -->
    <iframe id="tabFrame" class="tab-frame" src="work.html"></iframe>

    <script>
        function openTab(pageUrl, buttonElement) {
            // Update the iframe source
            document.getElementById('tabFrame').src = pageUrl;
            
            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Add active class to clicked button
            buttonElement.classList.add('active');
        }
    </script>
      </div>
    </div>
</body>
</html>
